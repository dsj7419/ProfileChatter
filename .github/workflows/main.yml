name: ProfileChatter Build

on:
  schedule:
    - cron: '0 */6 * * *'  # Fixed: removed extra asterisk
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'assets/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'profileChatterConfig.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'assets/**'
      - 'profileChatterConfig.json'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Updated to v4
        with:
          fetch-depth: 0
          # For PRs, this checks out the PR merge commit
          # For main branch events, this checks out the main branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Generate SVG
        env:
          # Weather API keys
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          LOCATION_KEY: ${{ secrets.LOCATION_KEY }}
          # WakaTime
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          # Spotify OAuth secrets for CI
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          # GitHub OAuth
          PAT_GITHUB_OAUTH: ${{ secrets.PAT_GITHUB_OAUTH }}
          GITHUB_DATA_MODE: 'ci'
        run: node src/build-profile.js

      - name: Record timestamp
        id: ts
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Update README timestamp
        # Only update README for main branch events (not PRs)
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          TS=${{ steps.ts.outputs.ts }}
          sed -i "s|profile-chat.svg?ts=[0-9]*|profile-chat.svg?ts=${TS}|g" README.md || true
          sed -i "s|profile-chat.svg)|profile-chat.svg?ts=${TS})|g" README.md || true

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull latest changes
        # Only run for main branch events when changes detected
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config --global user.name "ProfileChatter Bot"
          git config --global user.email "action@github.com"
          git pull --rebase --autostash origin main

          - name: Commit & push updated SVG
          if: steps.diff.outputs.changed == 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          uses: EndBug/add-and-commit@v9
          with:
            add: 'dist/profile-chat.svg README.md'
            message: "Auto-update profile chat SVG [skip ci] – ${{ steps.ts.outputs.ts }}"
            push: true
            # The action will use the user associated with this token for the push.
            # Ensure this PAT has 'repo' scope.
            github_token: ${{ secrets.PROFILECHATTER_ACTION_COMMIT_TOKEN }}
            # Optional: Explicitly set committer info if different from PAT owner
            committer_name: ProfileChatter Bot 
            committer_email: action@github.com
            # default_author: github_actor

      - name: Summary
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ steps.diff.outputs.changed }}" == "true" ]]; then
              echo "🔍 PR Check: SVG build completed successfully with changes detected."
              echo "📝 Changes would be committed when merged to main branch."
            else
              echo "✅ PR Check: SVG build completed with no changes needed."
            fi
          elif [[ "${{ steps.diff.outputs.changed }}" == "true" ]]; then
            echo "✅ SVG regenerated and committed to main branch."
          else
            echo "ℹ️ No changes detected – nothing to commit."
          fi