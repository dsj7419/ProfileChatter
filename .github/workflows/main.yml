name: ProfileChatter Build

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'assets/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'profileChatterConfig.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'assets/**'
      - 'profileChatterConfig.json'
  workflow_dispatch:

permissions:
  contents: write
  issues: write # PR-5b-ii: status-alert reconciler opens/updates/closes one stable issue

env:
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changes-detected: ${{ steps.diff.outputs.changed }}
      timestamp: ${{ steps.ts.outputs.ts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit & Integration Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Generate SVG
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          LOCATION_KEY: ${{ secrets.LOCATION_KEY }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          PAT_GITHUB_OAUTH: ${{ secrets.PAT_GITHUB_OAUTH }}
          GITHUB_DATA_MODE: 'ci'
        run: node src/build-profile.js

      # PR-5b-ii: monitoring sidecar. Reconciles ONE stable status-alert issue
      # from dist/status-manifest.json. Non-PR only (PRs must never touch issues).
      # continue-on-error so a transient Issues-API problem is shown red but never
      # blocks the SVG build/commit; the step itself writes a loud summary note.
      - name: Reconcile status alert
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node src/report-status-alert.js

      - name: Record timestamp
        id: ts
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Update README timestamp
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          TS=${{ steps.ts.outputs.ts }}
          sed -i "s|profile-chat.svg?ts=[0-9]*|profile-chat.svg?ts=${TS}|g" README.md || true
          sed -i "s|profile-chat.svg)|profile-chat.svg?ts=${TS})|g" README.md || true

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifacts
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: updated-files
          path: |
            dist/profile-chat.svg
            README.md
            dist/status-manifest.json

      - name: Summary
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ steps.diff.outputs.changed }}" == "true" ]]; then
              echo "🔍 PR Check: SVG build completed successfully with changes detected."
              echo "📝 Changes would be committed when merged to main branch."
            else
              echo "✅ PR Check: SVG build completed with no changes needed."
            fi
          elif [[ "${{ steps.diff.outputs.changed }}" == "true" ]]; then
            echo "✅ SVG generated successfully. Commit job will follow."
          else
            echo "ℹ️ No changes detected – nothing to commit."
          fi

  commit:
    needs: build
    if: needs.build.outputs.changes-detected == 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PROFILECHATTER_ACTION_COMMIT_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: updated-files

      - name: Commit & push updated SVG
        run: |
          git config --global user.name "ProfileChatter Bot"
          git config --global user.email "action@github.com"
          git add dist/profile-chat.svg README.md
          git commit -m "Auto-update profile chat SVG [skip ci] – ${{ needs.build.outputs.timestamp }}"
          git push

      - name: Summary
        run: echo "✅ SVG committed successfully to main branch."